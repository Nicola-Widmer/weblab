# Not a workspace — pnpm 11 reads project-level settings from this file.
# esbuild (Vitest) and @swc/core (Nest test transform, nest build) ship prebuilt
# binaries but need their postinstall to place them; without this `pnpm install`
# trips the ERR_PNPM_IGNORED_BUILDS gate in a clean environment. @scarf/scarf is
# install analytics — left disabled. cpu-features / ssh2 / protobufjs are
# optional native add-ons pulled in transitively by @testcontainers/postgresql
# (the Postgres test container talks over TCP) — their scripts stay skipped.
allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false

onlyBuiltDependencies:
  - esbuild
  - '@swc/core'
