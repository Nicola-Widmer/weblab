<div class="min-h-dvh pb-24">
  <header
    class="sticky top-0 z-20 border-b border-surface-200 bg-surface-0/80 backdrop-blur dark:border-surface-800 dark:bg-surface-950/80"
  >
    <div class="mx-auto flex max-w-5xl items-center gap-6 px-4 py-3">
      <a routerLink="/" class="flex items-center gap-2">
        <svg lucideDisc3 class="size-6 text-primary-500"></svg>
        <span class="text-lg font-semibold">{{ 'app.title' | translate }}</span>
      </a>
      <nav class="flex items-center gap-4 text-sm font-medium">
        <a
          routerLink="/songs"
          routerLinkActive="text-primary-500"
          class="text-surface-500 transition hover:text-primary-500 dark:text-surface-400"
        >
          {{ 'library.views.songs' | translate }}
        </a>
        <a
          routerLink="/playlists"
          routerLinkActive="text-primary-500"
          class="text-surface-500 transition hover:text-primary-500 dark:text-surface-400"
        >
          {{ 'library.views.playlists' | translate }}
        </a>
      </nav>
      <app-user-menu class="ml-auto" />
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-6">
    <router-outlet />
  </main>
</div>
<app-player />
