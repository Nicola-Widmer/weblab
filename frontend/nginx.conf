# Serves the built SPA and reverse-proxies /api to the Express container
# (ADR-0003). One origin → the session cookie stays first-party.

upstream api {
    server api:3000;
}

# Plain HTTP → redirect to HTTPS (TLS option A).
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Keep in sync with MAX_UPLOAD_BYTES on the API (ADR-0003, SNG-1: 20 MB).
    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. Audio/images are already compressed.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # SPA routes; the shell itself must always be revalidated
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Angular emits content-hashed bundles (main-HASH.js, chunk-HASH.js,
    # styles-HASH.css) at the web root: cache hard
    location ~* "^/[a-z]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Streaming: don't buffer audio/Range responses (ADR-0003).
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
